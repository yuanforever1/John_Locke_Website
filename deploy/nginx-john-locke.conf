# John Locke 手稿转写平台 —— Nginx 站点配置
# 放到服务器 /etc/nginx/sites-available/john-locke，再软链到 sites-enabled/
#
# 部署布局假设：
#   前端构建产物  /opt/john-locke/frontend/dist
#   后端 media    /opt/john-locke/backend/media
#   后端 static   /opt/john-locke/backend/staticfiles   (collectstatic 产物，供 admin 用)
#   gunicorn      127.0.0.1:8000
#
# 首次先用这份 HTTP 配置验证站点可访问；随后执行
#   sudo certbot --nginx -d john-locke.ccwu.cc
# certbot 会自动改写本文件、加入 443 与证书、并把 80 重定向到 443。

server {
    listen 80;
    listen [::]:80;
    server_name john-locke.ccwu.cc;

    # 上传图片可能较大，放宽请求体上限
    client_max_body_size 32m;

    # 后端 API：反代到 gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 手稿识别同步调用远程 Agnes API，最长 120s，这里放宽到 300s
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Django admin（可选，用到后台时需要）
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户上传及导入的手稿图片，由 Nginx 直接托管
    location /media/ {
        alias /opt/john-locke/backend/media/;
        access_log off;
        expires 7d;
    }

    # Django 静态资源（admin 后台等）
    location /static/ {
        alias /opt/john-locke/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    # 前端 SPA：静态文件 + history 模式回退
    location / {
        root /opt/john-locke/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
